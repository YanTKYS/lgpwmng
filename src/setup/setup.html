<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>ログイン画面の設定 - lgpwmng</title>
  <link rel="stylesheet" href="../ui/ui.css">
  <link rel="stylesheet" href="setup.css">
</head>
<body>
  <div class="page">
    <header class="page-header">
      <h1>ログイン画面の設定</h1>
      <div id="page-url" class="small muted"></div>
    </header>

    <section id="locked" class="hidden stack">
      <div class="notice">Vault がロックされています。</div>
      <form id="form-unlock" class="row">
        <input type="password" id="unlock-password" placeholder="マスターパスワード" autocomplete="current-password">
        <button type="submit" class="primary">アンロック</button>
      </form>
      <div id="unlock-status" class="status"></div>
    </section>

    <main id="main" class="hidden stack">
      <section class="block">
        <h2>サービス</h2>
        <div class="grid-2">
          <div>
            <div class="field-label">サービス名</div>
            <input type="text" id="service-name" placeholder="○○申請システム">
          </div>
          <div>
            <div class="field-label">メモ（任意）</div>
            <input type="text" id="service-note">
          </div>
        </div>
        <div class="grid-2">
          <div>
            <div class="field-label">オリジン（プロトコル + ホスト名 + ポート）</div>
            <div class="row">
              <input type="text" id="rule-origin" placeholder="https://example.asp.lgwan.jp">
              <select id="rule-origin-mode" class="mode">
                <option value="exact">完全一致</option>
                <option value="suffix">サブドメイン含む</option>
              </select>
            </div>
          </div>
          <div>
            <div class="field-label">パス</div>
            <div class="row">
              <input type="text" id="rule-pathname">
              <select id="rule-pathname-mode" class="mode">
                <option value="exact">完全一致</option>
                <option value="prefix">前方一致</option>
                <option value="any">パス問わず</option>
              </select>
            </div>
          </div>
        </div>
        <p id="rule-note" class="small muted hidden">このサービスには既存のURL条件があります。現在のURLが一致しない場合は条件が追加されます。</p>
      </section>

      <section class="block">
        <div class="row block-head">
          <h2>入力項目</h2>
          <span class="small muted">自動判定は目安です。対象入力欄を確認してから保存してください。</span>
          <span class="spacer"></span>
          <button type="button" id="btn-rescan">再スキャン</button>
          <button type="button" id="btn-add-field">項目を追加</button>
        </div>
        <table id="field-table">
          <thead>
            <tr>
              <th class="col-use">使用</th>
              <th class="col-label">表示名</th>
              <th class="col-scope">区分</th>
              <th class="col-kind">種別</th>
              <th>対象入力欄</th>
              <th class="col-action"></th>
            </tr>
          </thead>
          <tbody id="field-rows"></tbody>
        </table>
        <p id="no-candidates" class="small muted hidden">入力欄の候補が取得できませんでした。ログイン画面を開いた状態で拡張アイコンから開き直してください。</p>
      </section>

      <section class="block">
        <h2>サービス共通値</h2>
        <div id="shared-values" class="value-grid"></div>
        <p id="shared-empty" class="small muted hidden">区分を「共通」にした項目がここに表示されます。</p>
      </section>

      <section class="block">
        <div class="row block-head">
          <h2>アカウント</h2>
          <span class="spacer"></span>
          <button type="button" id="btn-add-account">＋ アカウントを追加</button>
        </div>
        <div id="account-list" class="stack"></div>
      </section>

      <footer class="page-footer">
        <button type="button" id="btn-save" class="primary">保存</button>
        <button type="button" id="btn-open-options">サービス一覧を開く</button>
        <div id="save-status" class="status"></div>
      </footer>
    </main>
  </div>

  <template id="tpl-field-row">
    <tr>
      <td class="col-use"><input type="checkbox" class="use"></td>
      <td class="col-label"><input type="text" class="label" placeholder="項目名"></td>
      <td class="col-scope">
        <select class="scope">
          <option value="account">アカウント</option>
          <option value="shared">共通</option>
        </select>
      </td>
      <td class="col-kind">
        <select class="kind">
          <option value="text">通常</option>
          <option value="secret">秘密</option>
        </select>
      </td>
      <td><select class="candidate"></select></td>
      <td class="col-action">
        <button type="button" class="highlight link">確認</button>
        <button type="button" class="remove link danger">削除</button>
      </td>
    </tr>
  </template>

  <script type="module" src="setup.js"></script>
</body>
</html>
